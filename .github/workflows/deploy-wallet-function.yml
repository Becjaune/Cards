name: Deploy Wallet Function

on:
  push:
    branches: [main]
    paths:
      - "functions/wallet-api/**"
      - ".github/workflows/deploy-wallet-function.yml"
  workflow_dispatch:

permissions:
  id-token: write   # requis pour le login Azure via OIDC (pas de secret longue durée)
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Function (PowerShell)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: functions/wallet-api

      - name: Azure logout
        if: always()
        run: az logout
