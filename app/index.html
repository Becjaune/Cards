<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ma carte de visite</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Ma carte de visite</h1>

  <section id="login-section">
    <p>Connectez-vous avec votre compte Microsoft 365 pour générer votre carte de visite.</p>
    <button id="login-btn">Se connecter avec Microsoft</button>
  </section>

  <section id="form-section" hidden>
    <p>Connecté en tant que <span id="whoami"></span> — <button id="logout-btn" type="button">Se déconnecter</button></p>
    <p>Vérifiez et corrigez si besoin les informations ci-dessous avant d'ajouter votre pass au wallet.</p>

    <form id="vcard-form"></form>
    <button id="submit-btn" form="vcard-form" type="submit">Ajouter à mon Wallet</button>
  </section>

  <p id="status" role="status"></p>

  <!-- TODO: épingler une version précise + ajouter un attribut integrity (SRI) une fois vérifié -->
  <script src="https://alcdn.msauth.net/browser/3.24.0/js/msal-browser.min.js"></script>
  <script src="config.js"></script>
  <script src="msal-auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
